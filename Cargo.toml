[package]
name = "qmp-qemu-socket"
version = "2.0.10"
edition = "2024"
rust-version = "1.101.0"
description = "A guarded QEMU/QMP controller operating on a Windows 11 VM running `Solitaire & Casual Games` application. This is to experiment with remote control and optimised screen image processing. Also Dijkstra/A* algorithm implementation for solving games."
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-winit = { version = "0.36.2", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }
raw-window-handle = "0.6.2"
serde_json = "1.0.151"
thiserror = "2.0.21"
# Use the exact promoted xsar commit; ordinary Cargo commands need no local override.
xsar = { git = "https://github.com/xsar-research/xsar", rev = "1a719b359a51d1e1e3113224193a779c76de82f8", default-features = false, features = ["qmp", "png", "image_matching"] }

[profile.release]
lto = "thin"
strip = "symbols"
